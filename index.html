<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>¿Se te antoja hablar?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f9ecd4;
        --card: #fffaf0;
        --ink: #33302b;
        --ink-soft: #6f675c;
        --coral: #ef5350;
        --coral-dark: #d63a37;
        --coral-ink: #ffffff;
        --no-bg: #efe6d8;
        --no-ink: #57504a;
        --shadow: 0 18px 45px rgba(120, 72, 30, 0.16);
        --ring: rgba(239, 83, 80, 0.35);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #241b18;
          --card: #322622;
          --ink: #f6ead9;
          --ink-soft: #c9b6a4;
          --coral: #ff6f61;
          --coral-dark: #ef5350;
          --coral-ink: #2a130e;
          --no-bg: #453630;
          --no-ink: #e8d9c8;
          --shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
          --ring: rgba(255, 111, 97, 0.4);
        }
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px 16px 32px;
        overflow-x: hidden;
      }

      main {
        width: 100%;
        max-width: 430px;
        text-align: center;
      }

      .card {
        background: var(--card);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 30px 24px 34px;
      }

      .pic {
        width: min(240px, 62vw);
        height: auto;
        border-radius: 22px;
        display: block;
        margin: 0 auto;
      }

      h1 {
        font-family: "Baloo 2", "Nunito", system-ui, sans-serif;
        font-weight: 800;
        font-size: clamp(1.9rem, 8.5vw, 2.5rem);
        line-height: 1.12;
        margin: 20px 0 6px;
        letter-spacing: -0.01em;
      }

      .plea {
        margin: 0 auto;
        min-height: 1.6em;
        max-width: 32ch;
        color: var(--ink-soft);
        font-size: 1.02rem;
        line-height: 1.5;
        transition: opacity 0.18s ease;
      }
      .plea.swap { opacity: 0; }

      .btn-row {
        position: relative;
        height: 76px;
        margin-top: 20px;
      }

      button {
        font-family: "Baloo 2", "Nunito", system-ui, sans-serif;
        font-weight: 700;
        border: none;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        touch-action: manipulation;
      }
      button:focus-visible {
        outline: 3px solid var(--ring);
        outline-offset: 3px;
      }

      #btnSi {
        position: absolute;
        left: 50%;
        top: 50%;
        background: var(--coral);
        color: var(--coral-ink);
        font-size: 1.3rem;
        padding: 14px 42px;
        border-radius: 999px;
        box-shadow: 0 8px 20px rgba(214, 58, 55, 0.35);
        transform: translate(calc(-100% - 10px), -50%);
        transform-origin: right center;
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease;
        z-index: 2;
        white-space: nowrap;
      }
      #btnSi:hover { background: var(--coral-dark); }
      #btnSi.pulse { animation: pulse 0.45s ease; }
      @keyframes pulse {
        0% { filter: brightness(1); }
        40% { filter: brightness(1.18); }
        100% { filter: brightness(1); }
      }

      #btnNo {
        position: absolute;
        left: 50%;
        top: 50%;
        background: var(--no-bg);
        color: var(--no-ink);
        font-size: 1.05rem;
        padding: 12px 30px;
        border-radius: 999px;
        transform: translate(10px, -50%);
        transform-origin: center;
        transition: left 0.28s cubic-bezier(0.34, 1.4, 0.64, 1),
                    top 0.28s cubic-bezier(0.34, 1.4, 0.64, 1),
                    transform 0.28s ease,
                    background 0.2s ease, color 0.2s ease;
        z-index: 3;
        white-space: nowrap;
      }
      #btnNo.free {
        position: fixed;
        margin: 0;
        z-index: 50;
      }
      #btnNo.gaveup {
        background: var(--coral);
        color: var(--coral-ink);
        box-shadow: 0 8px 20px rgba(214, 58, 55, 0.35);
      }

      .hint {
        margin-top: 14px;
        font-size: 0.85rem;
        color: var(--ink-soft);
        opacity: 0.75;
      }

      /* ---------- Pantalla de «sí» ---------- */
      #yesScreen { display: none; }
      #yesScreen.show { display: block; }
      #askScreen.gone { display: none; }

      .big-yes {
        font-family: "Baloo 2", "Nunito", system-ui, sans-serif;
        font-weight: 800;
        font-size: clamp(2.4rem, 11vw, 3.2rem);
        line-height: 1.05;
        margin: 18px 0 8px;
        color: var(--coral);
      }
      .yes-text {
        color: var(--ink-soft);
        font-size: 1.08rem;
        line-height: 1.55;
        max-width: 34ch;
        margin: 0 auto;
      }
      .yes-text strong { color: var(--ink); }

      #again {
        margin-top: 26px;
        background: transparent;
        color: var(--ink-soft);
        font-family: "Nunito", system-ui, sans-serif;
        font-weight: 700;
        font-size: 0.92rem;
        padding: 8px 14px;
        border-radius: 999px;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      #again:hover { color: var(--ink); }

      #confetti {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 100;
      }

      .heart-pop {
        position: fixed;
        z-index: 99;
        pointer-events: none;
        font-size: 22px;
        animation: floatUp 1.1s ease-out forwards;
      }
      @keyframes floatUp {
        0% { opacity: 0; transform: translateY(6px) scale(0.6); }
        20% { opacity: 1; }
        100% { opacity: 0; transform: translateY(-72px) scale(1.15); }
      }

      @media (prefers-reduced-motion: reduce) {
        #btnNo, #btnSi, .plea { transition: none; }
        #btnSi.pulse, .heart-pop { animation: none; }
      }
    </style>
  </head>

            alt="Personaje tierno con el teléfono, feliz"
            width="480"
            height="480"
          />
          <p class="big-yes">¡SÍ! 🎉</p>
          <p class="yes-text">
            Sabía que en el fondo sí querías. Ya el teléfono está en la mano,
            la conversación es lo único que falta… <strong>escríbeme tú primero.</strong> 😌
          </p>
          <button id="again" type="button">preguntar otra vez</button>
        </section>
      </div>
    </main>

    <script>
      (function () {
        var btnSi = document.getElementById("btnSi");
        var btnNo = document.getElementById("btnNo");
        var plea = document.getElementById("plea");
        var askScreen = document.getElementById("askScreen");
        var yesScreen = document.getElementById("yesScreen");
        var btnRow = document.getElementById("btnRow");
        var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        var dodges = 0;
        var noScale = 1;
        var siScale = 1;
        var gaveUp = false;
        var free = false;

        var pleas = [
          "Llevo un ratito esperando que me escribas… 🥲",
          "¿Segura que no? El botón como que no quiere cooperar…",
          "Mmm. Ese botón está medio dañado, ¿verdad?",
          "El «no» se está achicando de la vergüenza.",
          "Yo sigo aquí, con el teléfono en la mano. 📱",
          "Ya van varias… eso cuenta como interés, ¿no?",
          "El destino está tratando de decirte algo.",
          "Mira que hablar conmigo no es tan malo. 😌",
          "El botón de «no» ya casi ni se ve. Señales, son señales.",
          "Creo que el «no» acaba de rendirse…"
        ];

        var noLabels = ["No", "¿segura?", "¿de verdad?", "nop", "piénsalo…", "ese no vale", "casi", "🙃", "…"];

        function setPlea(text) {
          if (reduceMotion) { plea.textContent = text; return; }
          plea.classList.add("swap");
          setTimeout(function () {
            plea.textContent = text;
            plea.classList.remove("swap");
          }, 180);
        }

        function goFree() {
          if (free) return;
          free = true;
          var r = btnNo.getBoundingClientRect();
          btnNo.classList.add("free");
          btnNo.style.left = r.left + "px";
          btnNo.style.top = r.top + "px";
          btnNo.style.transform = "none";
          // deja el hueco en la fila para que el «sí» no brinque
          btnRow.style.minHeight = "76px";
        }

        function randomSpot() {
          var w = btnNo.offsetWidth * noScale;
          var h = btnNo.offsetHeight * noScale;
          var pad = 10;
          var maxX = Math.max(pad, window.innerWidth - w - pad);
          var maxY = Math.max(pad, window.innerHeight - h - pad);
          var si = btnSi.getBoundingClientRect();
          var x, y, tries = 0;
          do {
            x = pad + Math.random() * (maxX - pad);
            y = pad + Math.random() * (maxY - pad);
            tries++;
            // evita caer encima del botón «sí»
            var overlaps = x < si.right + 14 && x + w > si.left - 14 &&
                           y < si.bottom + 14 && y + h > si.top - 14;
            if (!overlaps) break;
          } while (tries < 14);
          return { x: x, y: y };
        }

        function hearts(x, y) {
          if (reduceMotion) return;
          var glyphs = ["🖤", "💬", "✨"];
          for (var i = 0; i < 3; i++) {
            var s = document.createElement("span");
            s.className = "heart-pop";
            s.textContent = glyphs[i % glyphs.length];
            s.style.left = (x - 10 + (Math.random() * 36 - 18)) + "px";
            s.style.top = (y - 14 + (Math.random() * 10 - 5)) + "px";
            document.body.appendChild(s);
            (function (el) { setTimeout(function () { el.remove(); }, 1150); })(s);
          }
        }

        function dodge(cx, cy) {
          if (gaveUp) return;
          dodges++;

          // achicar el «no», agrandar el «sí»
          noScale = Math.max(0.42, noScale * 0.88);
          siScale = Math.min(1.65, siScale * 1.09);

          goFree();
          var spot = randomSpot();
          btnNo.style.left = spot.x + "px";
          btnNo.style.top = spot.y + "px";
          var rot = (Math.random() * 16 - 8).toFixed(1);
          btnNo.style.transform = "scale(" + noScale + ") rotate(" + rot + "deg)";

          btnSi.style.transform =
            "translate(calc(-100% - 10px), -50%) scale(" + siScale + ")";
          btnSi.classList.remove("pulse");
          void btnSi.offsetWidth;
          btnSi.classList.add("pulse");

          btnNo.textContent = dodges >= 10 ? "bueno… sí 😅" : noLabels[Math.min(dodges, noLabels.length - 1)];
          setPlea(pleas[Math.min(dodges, pleas.length - 1)]);
          if (cx != null) hearts(cx, cy);

          if (dodges >= 10) {
            gaveUp = true;
            btnNo.classList.add("gaveup");
            setPlea("El botón de «no» se rindió oficialmente. Ya solo queda una opción. 😏");
          }
        }

        // Huida: al acercar el cursor, al tocarlo o al intentar clicar
        btnNo.addEventListener("pointerenter", function (e) {
          if (e.pointerType === "mouse") dodge(e.clientX, e.clientY);
        });
        btnNo.addEventListener("pointerdown", function (e) {
          if (!gaveUp) { e.preventDefault(); dodge(e.clientX, e.clientY); }
        });
        btnNo.addEventListener("click", function () {
          if (gaveUp) sayYes();
        });
        btnNo.addEventListener("focus", function () {
          if (!gaveUp) dodge(null, null);
        });

        window.addEventListener("resize", function () {
          if (free && !gaveUp) {
            var spot = randomSpot();
            btnNo.style.left = spot.x + "px";
            btnNo.style.top = spot.y + "px";
          }
        });

        /* ---------- Confeti ---------- */
        var canvas = document.getElementById("confetti");
        var ctx = canvas.getContext("2d");
        var pieces = [];
        var raf = null;

        function sizeCanvas() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
        sizeCanvas();
        window.addEventListener("resize", sizeCanvas);

        function launchConfetti() {
          if (reduceMotion) return;
          var colors = ["#ef5350", "#ffb74d", "#ffd54f", "#81c784", "#4fc3f7", "#f6ead9"];
          pieces = [];
          for (var i = 0; i < 160; i++) {
            pieces.push({
              x: Math.random() * canvas.width,
              y: -20 - Math.random() * canvas.height * 0.35,
              w: 6 + Math.random() * 6,
              h: 8 + Math.random() * 8,
              vy: 2 + Math.random() * 3.2,
              vx: -1.4 + Math.random() * 2.8,
              rot: Math.random() * Math.PI,
              vr: -0.12 + Math.random() * 0.24,
              color: colors[i % colors.length],
              circle: Math.random() < 0.3
            });
          }
          var start = null;
          function frame(ts) {
            if (!start) start = ts;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            var alive = false;
            for (var i = 0; i < pieces.length; i++) {
              var p = pieces[i];
              p.x += p.vx; p.y += p.vy; p.rot += p.vr;
              if (p.y < canvas.height + 30) alive = true;
              ctx.save();
              ctx.translate(p.x, p.y);
              ctx.rotate(p.rot);
              ctx.fillStyle = p.color;
              if (p.circle) {
                ctx.beginPath();
                ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
                ctx.fill();
              } else {
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
              }
              ctx.restore();
            }
            if (alive && ts - start < 6500) {
              raf = requestAnimationFrame(frame);
            } else {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              raf = null;
            }
          }
          if (raf) cancelAnimationFrame(raf);
          raf = requestAnimationFrame(frame);
        }

        /* ---------- Sí ---------- */
        function sayYes() {
          askScreen.classList.add("gone");
          btnNo.style.display = "none";
          yesScreen.classList.add("show");
          launchConfetti();
          window.scrollTo(0, 0);
        }
        btnSi.addEventListener("click", sayYes);

        document.getElementById("again").addEventListener("click", function () {
          // reinicia la broma
          dodges = 0; noScale = 1; siScale = 1; gaveUp = false; free = false;
          yesScreen.classList.remove("show");
          askScreen.classList.remove("gone");
          btnNo.style.display = "";
          btnNo.classList.remove("free", "gaveup");
          btnNo.style.left = "";
          btnNo.style.top = "";
          btnNo.style.transform = "";
          btnNo.textContent = "No";
          btnSi.style.transform = "";
          setPlea(pleas[0]);
        });
      })();
    </script>
  </body>
</html>
